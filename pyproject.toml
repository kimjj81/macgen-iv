[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fastgen-profiler"
version = "0.1.0"
description = "MLX video generation profiling and benchmark tooling for Mac and Apple Silicon."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "macgen-iv contributors" }]
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]
mlx = [
    "mlx>=0.24",
    "mlx-lm>=0.31.3",
    "mlx-video",
]

[project.scripts]
fastgen-profile = "fastgen_profiler.cli:main"
fastgen-profiler = "fastgen_profiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
mlx-video = { git = "https://github.com/Blaizzy/mlx-video.git" }
